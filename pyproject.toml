[project]
name = "funnyreason"
version = "0.1.0"
description = "A simple package that gives a random funny reason for anything."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Infinitive", email = "Yao_icft@outlook.com" }]

# [project.urls]
# Homepage = "https://pypi.org/project/funnyreason/"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
